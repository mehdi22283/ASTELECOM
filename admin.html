<!DOCTYPE html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="style.css"><style>.rvbox{max-width:860px;max-height:92vh;overflow:auto}.modal{z-index:50}#q{flex:1;min-width:160px}#rt input[type=checkbox]{width:20px;height:20px}#rt input,#rt select{padding:7px 8px}.sm{color:var(--mut);font-size:.9rem}</style></head><body>
<div class="wrap">
<header><div class="logo">ASTELECOM · Admin</div><button class="ghost" id="out" style="display:none">Çıxış</button></header>
<form id="lg" class="box" style="margin:60px auto"><h3>Giriş</h3><input id="em" type="email" placeholder="Email" required><input id="pw" type="password" placeholder="Şifrə" required><button>Daxil ol</button></form>
<div id="pn" style="display:none">
<div class="stats" id="st"></div>
<div class="row"><button onclick="tab('n')">Nömrələr</button><button class="ghost" onclick="tab('o')">Sifarişlər</button></div>
<div id="tn">
<form id="af" class="filters">
<input id="p" placeholder="Nömrə: 0507777777" required pattern="\d{10}" inputmode="numeric">
<select id="op"><option>Azercell</option><option>Bakcell</option><option>Nar</option></select>
<select id="ct"><option value="VIP">👑 VIP</option><option value="Qızıl">🥇 Qızıl</option><option value="Gümüş">🥈 Gümüş</option><option value="Bürünc">🥉 Bürünc</option></select>
<input id="pr" type="number" placeholder="Qiymət ₼" required min="0">
<button class="gold">Nömrə əlavə et</button>
</form>
<div class="row"><input id="q" inputmode="numeric" autocomplete="off" placeholder="🔍 Nömrə axtar"><button id="bb" class="ghost">➕ Toplu əlavə</button><button id="sc" class="gold">📷 Fotodan skan</button><input type="file" id="fl" accept="image/*" hidden><button id="bd" class="red" style="display:none"></button></div>
<div class="scroll"><table id="nt"></table></div></div>
<div id="to" style="display:none"><div class="scroll"><table id="ot"></table></div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<div class="modal" id="bm"><div class="box rvbox"><h3>Toplu nömrə əlavə et</h3><p class="sm">Hər sətirdə bir nömrə və qiymət yazın, məsələn: 0554660655 20</p><textarea id="bulk" rows="9" style="width:100%" placeholder="0554660655 20&#10;0558885950 20"></textarea><div class="row"><button class="ghost" onclick="$('bm').classList.remove('on')">Bağla</button><button class="gold" onclick="bulkRead()">Oxu və göstər</button></div></div></div>
<div class="modal" id="rv"><div class="box rvbox"><h3>Nəticəni yoxlayın</h3><p class="sm" id="rvs"></p><div class="scroll"><table id="rt"></table></div><div class="row"><button class="ghost" onclick="rvClose()">Ləğv et</button><button class="gold" id="rvok" disabled>Təsdiq et</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);let N=[],O=[];const IC={VIP:"👑",Qızıl:"🥇",Gümüş:"🥈",Bürünc:"🥉"};
async function check(){const{data:{session}}=await db.auth.getSession();
 $("lg").style.display=session?"none":"";$("pn").style.display=$("out").style.display=session?"":"none";if(session)load()}
$("lg").onsubmit=async e=>{e.preventDefault();const{error}=await db.auth.signInWithPassword({email:$("em").value,password:$("pw").value});error?alert("Email və ya şifrə səhvdir"):check()};
$("out").onclick=async()=>{await db.auth.signOut();check()};
function tab(t){$("tn").style.display=t=="n"?"":"none";$("to").style.display=t=="o"?"":"none"}
async function load(){const[n,o]=await Promise.all([db.from("numbers").select("*").order("id",{ascending:false}),db.from("orders").select("*").order("id",{ascending:false})]);N=n.data||[];O=o.data||[];draw()}
function draw(){const c=s=>N.filter(x=>x.status==s).length;
 $("st").innerHTML=[["Aktiv",c("aktiv")],["Rezerv",c("rezerv")],["Satılıb",c("satılıb")],["Yeni sifariş",O.filter(x=>x.status=="yeni").length]].map(a=>`<div class="stat"><b>${a[1]}</b>${a[0]}</div>`).join("");
 const sel=(v,a)=>a.map(x=>`<option ${x==v?"selected":""}>${x}</option>`).join("");
 pruneS();const V=vis();$("nt").innerHTML="<tr><th><input type=\"checkbox\" aria-label=\"Hamısını seç\" "+(V.length&&V.every(x=>S.has(x.id))?"checked":"")+" onchange=\"pickAll(this.checked)\"><th>Nömrə<th>Operator<th>Kateqoriya<th>Qiymət<th>Status<th></tr>"+V.map(x=>`<tr><td><input type="checkbox" ${S.has(x.id)?"checked":""} onchange="pick(${x.id},this.checked)"><td>${fmt(x.phone)}<td>${esc(x.operator)}<td>${IC[x.category]||""} ${esc(x.category)}<td><a href="#" onclick="price(${x.id});return false">${esc(x.price)} ₼ ✎</a><td><select onchange="upd(${x.id},this.value)">${sel(x.status,["aktiv","rezerv","satılıb"])}</select><td><button class="red" onclick="del(${x.id})">Sil</button></tr>`).join("");
 const n=S.size;$("bd").style.display=n?"":"none";$("bd").textContent="🗑 Seçilmişləri sil ("+n+")";
 $("ot").innerHTML="<tr><th>Tarix<th>Nömrə<th>Ad<th>Əlaqə<th>Qeyd<th>Status<th></tr>"+O.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString("az")}<td>${fmt(x.phone)}<td>${esc(x.name)}<td>${esc(x.contact)}<td>${esc(x.note)}<td><select onchange="ost(${x.id},this.value)">${sel(x.status,["yeni","əlaqə saxlanıldı","tamamlandı"])}</select><td><button class="red" onclick="odel(${x.id})">Sil</button></tr>`).join("")}
const run=async p=>{const{error}=await p;if(error)alert(error.message);load()};
const upd=(id,s)=>run(db.from("numbers").update({status:s}).eq("id",id));
const price=id=>{const v=prompt("Yeni qiymət (₼):");if(v&&!isNaN(v))run(db.from("numbers").update({price:+v}).eq("id",id))};
const del=id=>confirm("Nömrə silinsin?")&&run(db.from("numbers").delete().eq("id",id));
const ost=(id,s)=>run(db.from("orders").update({status:s}).eq("id",id));
const odel=id=>confirm("Sifariş silinsin?")&&run(db.from("orders").delete().eq("id",id));
$("af").onsubmit=e=>{e.preventDefault();run(db.from("numbers").insert({phone:$("p").value,operator:$("op").value,category:$("ct").value,price:+$("pr").value}));e.target.reset()};
$("q").oninput=draw;
let S=new Set();
const vis=()=>{const q=$("q").value.replace(/\D/g,"");return N.filter(x=>!q||x.phone.includes(q))};
const pruneS=()=>{const ids=new Set(N.map(x=>x.id));S=new Set([...S].filter(i=>ids.has(i)))};
const pick=(id,on)=>{on?S.add(id):S.delete(id);draw()};
const pickAll=on=>{vis().forEach(x=>on?S.add(x.id):S.delete(x.id));draw()};
$("bd").onclick=()=>{const ids=[...S];if(ids.length&&confirm(ids.length+" nömrə silinsin?")){S.clear();run(db.from("numbers").delete().in("id",ids))}};
const PH=/(0\d{2})[\s\-.–]*(\d{3})[\s\-.–]*(\d{2})[\s\-.–]*(\d{2})/g;
const OPS={"050":"Azercell","051":"Azercell","010":"Azercell","055":"Bakcell","099":"Bakcell","070":"Nar","077":"Nar"},OPL=["Azercell","Bakcell","Nar"],CATS=["VIP","Qızıl","Gümüş","Bürünc"];
const guess=p=>{const d=p.slice(3),seq=(s,a)=>{for(let i=1;i<s.length;i++)if(+s[i]-+s[i-1]!=a)return false;return true};
 if(/(\d)\1{4}$/.test(d)||d==[...d].reverse().join("")||seq(d.slice(1),1)||seq(d.slice(1),-1))return"VIP";
 if(/(\d)\1{3}$/.test(d)||/(\d\d)\1$/.test(d)||/(\d)(\d)\2\1$/.test(d)||seq(d.slice(3),1)||seq(d.slice(3),-1))return"Qızıl";
 if(/(\d)\1\1$/.test(d)||/(\d)\1(\d)\2$/.test(d)||/00$/.test(d)||seq(d.slice(4),1)||seq(d.slice(4),-1))return"Gümüş";
 return"Bürünc"};
function parse(text){const out=[],fix=(v,a)=>a.find(x=>x.toLowerCase()==v.toLowerCase());
 text.split(/\n+/).forEach(line=>{const ms=[...line.matchAll(PH)];
  ms.forEach((m,i)=>{const end=m.index+m[0].length,rest=line.slice(end,ms[i+1]?ms[i+1].index:line.length),ph=m[1]+m[2]+m[3]+m[4],
   pm=rest.match(/\d{1,5}/),cm=rest.match(/vip|qızıl|gümüş|bürünc/i),om=rest.match(/azercell|bakcell|nar/i);
   out.push({ph,op:om?fix(om[0],OPL):(OPS[ph.slice(0,3)]||""),cat:cm?fix(cm[0],CATS):guess(ph),pr:pm?+pm[0]:"",on:!!pm})})});
 const seen=new Set();return out.filter(r=>!seen.has(r.ph)&&seen.add(r.ph))}
let R=[];
const optS=(v,a)=>a.map(x=>`<option value="${x}" ${x==v?"selected":""}>${x||"—"}</option>`).join("");
const rvCount=()=>{$("rvs").textContent=R.filter(r=>r.on).length+" / "+R.length+" nömrə seçilib. Yoxlayın, lazım olsa düzəldin, sonra Təsdiq edin."};
function rvOpen(m){$("rv").classList.add("on");$("rt").innerHTML="";$("rvs").textContent=m;$("rvok").disabled=true}
const rvClose=()=>$("rv").classList.remove("on");
function rvDraw(){const ex=new Set(N.map(x=>x.phone));
 $("rt").innerHTML="<tr><th><th>Nömrə<th>Operator<th>Kateqoriya<th>Qiymət ₼<th></tr>"+R.map((r,i)=>`<tr><td><input type="checkbox" ${r.on?"checked":""} onchange="R[${i}].on=this.checked;rvCount()"><td><input value="${r.ph}" maxlength="10" inputmode="numeric" style="width:130px" onchange="R[${i}].ph=this.value.replace(/\\D/g,'');rvDraw()">${ex.has(r.ph)?' <span class="tag">mövcuddur</span>':""}<td><select onchange="R[${i}].op=this.value">${optS(r.op,["",...OPL])}</select><td><select onchange="R[${i}].cat=this.value">${optS(r.cat,CATS)}</select><td><input type="number" min="0" value="${r.pr}" style="width:90px" onchange="R[${i}].pr=this.value"><td><button class="red" onclick="R.splice(${i},1);rvDraw()">✕</button></tr>`).join("");
 rvCount();$("rvok").disabled=!R.length}
$("rvok").onclick=()=>{const sel=R.filter(r=>r.on);if(!sel.length)return alert("Heç nə seçilməyib");
 const bad=sel.find(r=>!/^0\d{9}$/.test(r.ph)||!OPL.includes(r.op)||r.pr===""||isNaN(+r.pr));
 if(bad)return alert("Səhv sətir: "+bad.ph+" (nömrə 10 rəqəm olmalı, operator və qiymət doldurulmalıdır)");
 run(db.from("numbers").upsert(sel.map(r=>({phone:r.ph,operator:r.op,category:r.cat,price:+r.pr})),{onConflict:"phone"}));rvClose()};
$("bb").onclick=()=>$("bm").classList.add("on");
function bulkRead(){const rows=parse($("bulk").value);if(!rows.length)return alert("Nömrə tapılmadı. Hər sətirdə nömrə və qiymət yazın.");
 $("bm").classList.remove("on");R=rows;rvOpen("");rvDraw();$("bulk").value=""}
$("sc").onclick=()=>$("fl").click();
$("fl").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)scan(f)};
async function scan(f){rvOpen("Şəkil hazırlanır…");let w;
 try{const bm=await createImageBitmap(f),k=Math.min(3,Math.max(1,2000/bm.width)),c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
  const g=c.getContext("2d",{willReadFrequently:true});g.drawImage(bm,0,0,c.width,c.height);const im=g.getImageData(0,0,c.width,c.height),d=im.data,L=new Uint8Array(d.length/4);let s=0;
  for(let i=0;i<L.length;i++){L[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];s+=L[i]}
  const dark=s/L.length<128;
  for(let i=0;i<L.length;i++){const v=dark?(L[i]>150?0:255):(L[i]>128?255:0);d[i*4]=d[i*4+1]=d[i*4+2]=v;d[i*4+3]=255}
  g.putImageData(im,0,0);
  w=await Tesseract.createWorker("eng",1,{logger:m=>{if(m.status=="recognizing text")$("rvs").textContent="Oxunur… "+Math.round(m.progress*100)+"%"}});
  await w.setParameters({tessedit_char_whitelist:"0123456789-. ",tessedit_pageseg_mode:"11"});
  const{data}=await w.recognize(c);let text=data.text;
  if(data.words&&data.words.length){const ws=data.words.filter(x=>x.text.trim()).map(x=>({t:x.text.trim(),y:(x.bbox.y0+x.bbox.y1)/2,h:x.bbox.y1-x.bbox.y0,x:x.bbox.x0})).sort((a,b)=>a.y-b.y),
   hs=ws.map(x=>x.h).sort((a,b)=>a-b),mh=hs[hs.length>>1]||20,rows=[];
   ws.forEach(x=>{const r=rows[rows.length-1];if(r&&x.y-r.y<mh*.6){r.w.push(x);r.y=(r.y*(r.w.length-1)+x.y)/r.w.length}else rows.push({y:x.y,w:[x]})});
   text=rows.map(r=>r.w.sort((a,b)=>a.x-b.x).map(x=>x.t).join(" ")).join("\n")}
  R=parse(text);if(!R.length)$("rvs").textContent="Nömrə tapılmadı. Daha aydın şəkillə yenidən cəhd edin.";else rvDraw()}
 catch(err){$("rvs").textContent="Şəkil oxunmadı: "+(err.message||err)+". İnternet bağlantısını yoxlayın."}
 finally{if(w)w.terminate()}}
check();
</script></body></html>
