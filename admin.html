<!DOCTYPE html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="style.css"><style>.rvbox{max-width:860px;max-height:92vh;overflow:auto}.modal{z-index:50}#q{flex:1;min-width:160px}#rt input[type=checkbox]{width:20px;height:20px}#rt input,#rt select{padding:7px 8px}.sm{color:var(--mut);font-size:.9rem}
.ph,.pz{font-size:1.5em}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#c0392b;color:#fff;padding:12px 18px;border-radius:10px;z-index:100;max-width:90vw;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}#toast.on{opacity:1}
#af>*{min-width:0;width:100%}
#nt select{padding:6px 6px;font-size:.8rem;max-width:100%}
@media(max-width:700px){
#af{grid-template-columns:1fr 1fr;gap:8px}
#af #p{grid-column:1/-1}
#af select,#af input,#af button{padding:11px 8px;font-size:.92rem}
#nt{min-width:0;display:block;width:100%}
#nt tbody{display:block}
#nt tr{display:grid;grid-template-columns:28px 1fr auto;gap:6px 8px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
#nt td,#nt th{border:0;padding:0;min-width:0;font-size:.85rem}
#nt tr:first-child th:nth-child(n+3){display:none}
#nt tr:first-child{padding:8px 2px}
#nt td:nth-child(1){grid-column:1;grid-row:1}
#nt td:nth-child(2){grid-column:2;grid-row:1;font-size:1rem;font-weight:700;white-space:nowrap}
#nt td:nth-child(5){grid-column:3;grid-row:2;justify-self:end;white-space:nowrap}
#nt td:nth-child(7){grid-column:3;grid-row:1;justify-self:end}
#nt td:nth-child(3){grid-column:2;grid-row:2;color:var(--mut)}
#nt td:nth-child(4){grid-column:2;grid-row:3;white-space:nowrap}
#nt td:nth-child(6){grid-column:3;grid-row:3;justify-self:end}
#nt button.red{padding:6px 10px;font-size:.8rem}
#rzt{min-width:0;display:block;width:100%}
#rzt tbody{display:block}
#rzt tr{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
#rzt td,#rzt th{border:0;padding:0;min-width:0;font-size:.85rem}
#rzt tr:first-child{display:none}
#rzt td:nth-child(1){grid-column:1/-1;grid-row:1;font-size:1rem;font-weight:700;white-space:nowrap}
#rzt td:nth-child(4){grid-column:2;grid-row:2;justify-self:end;white-space:nowrap;font-weight:700}
#rzt td:nth-child(2){grid-column:1;grid-row:2;color:var(--mut)}
#rzt td:nth-child(3){grid-column:1;grid-row:3;white-space:nowrap}
#rzt td:nth-child(5){grid-column:2;grid-row:3;justify-self:end}
#rzt select{padding:6px 6px;font-size:.8rem;max-width:100%}
#rzt td[colspan]{grid-column:1/-1;grid-row:1}
}
</style></head><body>
<div class="wrap">
<header><div class="logo">ASTELECOM · Admin</div><button class="ghost" id="out" style="display:none">Çıxış</button></header>
<form id="lg" class="box" style="margin:60px auto"><h3>Giriş</h3><input id="em" type="email" placeholder="Email" required><input id="pw" type="password" placeholder="Şifrə" required><button>Daxil ol</button></form>
<div id="pn" style="display:none">
<div class="stats" id="st"></div>
<div class="row"><button id="tbn" onclick="tab('n')">Nömrələr</button><button id="tbo" class="ghost" onclick="tab('o')">Sifarişlər</button><button id="tbr" class="ghost" onclick="tab('r')">Rezerv</button></div>
<div id="tn">
<form id="af" class="filters">
<input id="p" type="tel" placeholder="Nömrə: 0507777777" required pattern="\d{10}" maxlength="10" inputmode="tel" autocomplete="off" oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)">
<input id="pr" type="tel" inputmode="tel" maxlength="6" autocomplete="off" placeholder="Qiymət ₼" required>
<button class="gold">Nömrə əlavə et</button>
</form>
<div class="row"><input id="q" type="tel" inputmode="tel" autocomplete="off" placeholder="Nömrə axtar"><button id="qb" class="gold">🔍 Axtar</button><button id="bb" class="ghost">➕ Toplu əlavə</button><button id="bd" class="red">🗑 Sil (0)</button><button id="ex" class="ghost">⬇ Export</button></div>
<div class="contact" style="margin:0 0 16px"><h2>Sistemdə axtar</h2><div class="acts" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:12px"><a class="cbtn" style="background:#6d2fd1" target="_blank" rel="noopener" href="https://azercellim.com">Azərcelldə axtar</a><a class="cbtn" style="background:#00a651" target="_blank" rel="noopener" href="https://bakcell.com/number-sale">Bakcelldə axtar</a><a class="cbtn" style="background:#e4002b" target="_blank" rel="noopener" href="https://www.narsim.az/">Narda axtar</a></div></div>
<div class="scroll"><table id="nt"></table></div></div>
<div id="to" style="display:none"><div class="scroll"><table id="ot"></table></div></div>
<div id="trz" style="display:none"><div class="scroll"><table id="rzt"></table></div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<div class="modal" id="bm"><div class="box rvbox"><h3>Toplu nömrə əlavə et</h3><p class="sm">Hər sətirdə bir nömrə və qiymət yazın, məsələn: 0554660655 20</p><textarea id="bulk" rows="9" style="width:100%" placeholder="0554660655 20&#10;0558885950 20"></textarea><div class="row"><button class="ghost" onclick="$('bm').classList.remove('on')">Bağla</button><button class="gold" onclick="bulkRead()">Oxu və göstər</button></div></div></div>
<div class="modal" id="rv"><div class="box rvbox"><h3>Nəticəni yoxlayın</h3><p class="sm" id="rvs"></p><div class="scroll"><table id="rt"></table></div><div class="row"><button class="ghost" onclick="rvClose()">Ləğv et</button><button class="gold" id="rvok" disabled>Təsdiq et</button></div></div></div>
<div class="modal" id="xm"><div class="box"><h3>Export</h3><label class="sm">Cədvəl</label><select id="xt"><option value="numbers">Nömrələr</option><option value="orders">Sifarişlər</option></select><label class="sm">Format</label><select id="xf"><option value="xlsx">Excel (.xlsx)</option><option value="csv">CSV (.csv) — cədvəl kimi açılır</option><option value="db">Verilənlər bazası (.db)</option></select><div class="row"><button class="ghost" onclick="$('xm').classList.remove('on')">Bağla</button><button class="gold" id="xgo">Yüklə</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
<div id="toast"></div>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);let N=[],O=[];const IC={VIP:"👑",Qızıl:"🥇",Gümüş:"🥈",Bürünc:"🥉"};
async function check(){const{data:{session}}=await db.auth.getSession();
 $("lg").style.display=session?"none":"";$("pn").style.display=$("out").style.display=session?"":"none";if(session)load()}
$("lg").onsubmit=async e=>{e.preventDefault();const{error}=await db.auth.signInWithPassword({email:$("em").value,password:$("pw").value});error?alert("Email və ya şifrə səhvdir"):check()};
$("out").onclick=async()=>{await db.auth.signOut();check()};
function tab(t){[["n","tbn","tn"],["o","tbo","to"],["r","tbr","trz"]].forEach(a=>{$(a[1]).classList.toggle("ghost",t!=a[0]);$(a[2]).style.display=t==a[0]?"":"none"})}
async function load(){const[n,o]=await Promise.all([db.from("numbers").select("*").order("id",{ascending:false}),db.from("orders").select("*").order("id",{ascending:false})]);N=n.data||[];O=o.data||[];draw()}
function draw(){const c=s=>N.filter(x=>x.status==s).length;
 $("st").innerHTML=[["Aktiv",c("aktiv")],["Rezerv",c("rezerv")],["Satılıb",c("satılıb")],["Yeni sifariş",O.filter(x=>x.status=="yeni").length]].map(a=>`<div class="stat"><b>${a[1]}</b>${a[0]}</div>`).join("");
 const sel=(v,a)=>a.map(x=>`<option ${x==v?"selected":""}>${x}</option>`).join("");
 pruneS();const V=vis();$("nt").innerHTML="<tr><th><input type=\"checkbox\" aria-label=\"Hamısını seç\" "+(V.length&&V.every(x=>S.has(x.id))?"checked":"")+" onchange=\"pickAll(this.checked)\"><th>Nömrə<th>Operator<th>Kateqoriya<th>Qiymət<th>Status<th></tr>"+V.map(x=>`<tr><td><input type="checkbox" ${S.has(x.id)?"checked":""} onchange="pick(${x.id},this.checked)"><td><span class="ph">${fmt(x.phone)}</span><td>${esc(x.operator)}<td>${IC[x.category]||""} ${esc(x.category)}<td><a class="pz" href="#" onclick="price(${x.id});return false">${esc(x.price)} ₼ ✎</a><td><select onchange="upd(${x.id},this.value)">${sel(x.status,["aktiv","rezerv","satılıb"])}</select><td><button class="red" onclick="del(${x.id})">Sil</button></tr>`).join("");
 const n=S.size;$("bd").style.opacity=n?1:.6;$("bd").textContent="🗑 Sil ("+n+")";
 $("ot").innerHTML="<tr><th>Tarix<th>Nömrə<th>Ad<th>Əlaqə<th>Qeyd<th>Status<th></tr>"+O.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString("az")}<td><span class="ph">${fmt(x.phone)}</span><td>${esc(x.name)}<td>${esc(x.contact)}<td>${esc(x.note)}<td><select onchange="ost(${x.id},this.value)">${sel(x.status,["yeni","əlaqə saxlanıldı","tamamlandı"])}</select><td><button class="red" onclick="odel(${x.id})">Sil</button></tr>`).join("");
 const RZ=N.filter(x=>x.status=="rezerv");$("tbr").textContent="Rezerv ("+RZ.length+")";
 $("rzt").innerHTML="<tr><th>Nömrə<th>Operator<th>Kateqoriya<th>Qiymət<th>Status</tr>"+(RZ.length?RZ.map(x=>`<tr><td><span class="ph">${fmt(x.phone)}</span><td>${esc(x.operator)}<td>${IC[x.category]||""} ${esc(x.category)}<td><span class="pz">${esc(x.price)} ₼</span><td><select onchange="upd(${x.id},this.value)">${sel(x.status,["aktiv","rezerv","satılıb"])}</select></tr>`).join(""):'<tr><td colspan="5" class="sm">Rezerv olunmuş nömrə yoxdur</tr>')}
let tt;const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3500)};
const run=async p=>{const{error}=await p;if(error)alert(error.message);load()};
const upd=(id,s)=>run(db.from("numbers").update({status:s}).eq("id",id));
const price=id=>{const v=prompt("Yeni qiymət (₼):");if(v&&!isNaN(v))run(db.from("numbers").update({price:+v}).eq("id",id))};
const del=id=>confirm("Nömrə silinsin?")&&run(db.from("numbers").delete().eq("id",id));
const ost=(id,s)=>run(db.from("orders").update({status:s}).eq("id",id));
const odel=id=>confirm("Sifariş silinsin?")&&run(db.from("orders").delete().eq("id",id));
$("af").onsubmit=e=>{e.preventDefault();const ph=$("p").value,op=OPS[ph.slice(0,3)];if(!op)return alert("Prefiks tanınmadı ("+ph.slice(0,3)+"). Operator təyin edilə bilmədi.");if(N.some(x=>x.phone==ph))return toast("Bu nömrə artıq siyahıdadır: "+fmt(ph));run(db.from("numbers").insert({phone:ph,operator:op,category:catByPrice($("pr").value),price:+$("pr").value}));e.target.reset()};
$("pr").oninput=()=>{$("pr").value=$("pr").value.replace(/\D/g,"").slice(0,6)};
$("q").oninput=draw;$("qb").onclick=draw;$("q").onkeydown=e=>{if(e.key=="Enter")draw()};
let S=new Set();
const vis=()=>{const q=$("q").value.replace(/\D/g,"");return N.filter(x=>!q||x.phone.includes(q))};
const pruneS=()=>{const ids=new Set(N.map(x=>x.id));S=new Set([...S].filter(i=>ids.has(i)))};
const pick=(id,on)=>{on?S.add(id):S.delete(id);draw()};
const pickAll=on=>{vis().forEach(x=>on?S.add(x.id):S.delete(x.id));draw()};
$("bd").onclick=()=>{const ids=[...S];if(!ids.length)return alert("Əvvəlcə silinəcək nömrələrin yanındakı qutuları işarələyin");if(confirm(ids.length+" nömrə silinsin?")){S.clear();run(db.from("numbers").delete().in("id",ids))}};
const PH=/(0\d{2})[\s\-.–]*(\d{3})[\s\-.–]*(\d{2})[\s\-.–]*(\d{2})/g;
const OPS={"050":"Azercell","051":"Azercell","010":"Azercell","055":"Bakcell","099":"Bakcell","070":"Nar","077":"Nar"},OPL=["Azercell","Bakcell","Nar"],CATS=["VIP","Qızıl","Gümüş","Bürünc"];
const catByPrice=v=>{const p=parseFloat(v);return isNaN(p)||p<=50?"Bürünc":p<=100?"Gümüş":p<=300?"Qızıl":"VIP"};
function parse(text){const out=[],fix=(v,a)=>a.find(x=>x.toLowerCase()==v.toLowerCase());
 text.replace(/(^|[^\d])\+?\s*994[\s\-.]*(?=\d{2})/g,"$10").split(/\n+/).forEach(line=>{const ms=[...line.matchAll(PH)];
  ms.forEach((m,i)=>{const end=m.index+m[0].length,rest=line.slice(end,ms[i+1]?ms[i+1].index:line.length),ph=m[1]+m[2]+m[3]+m[4],
   pm=rest.match(/\d{1,5}/),cm=rest.match(/vip|qızıl|gümüş|bürünc/i),om=rest.match(/azercell|bakcell|nar/i);
   out.push({ph,op:om?fix(om[0],OPL):(OPS[ph.slice(0,3)]||""),cat:cm?fix(cm[0],CATS):catByPrice(pm?pm[0]:""),pr:pm?+pm[0]:"",on:!!pm})})});
 const seen=new Set();return out.filter(r=>!seen.has(r.ph)&&seen.add(r.ph))}
let R=[];
const optS=(v,a)=>a.map(x=>`<option value="${x}" ${x==v?"selected":""}>${x||"—"}</option>`).join("");
const rvCount=()=>{$("rvs").textContent=R.filter(r=>r.on).length+" / "+R.length+" nömrə seçilib. Yoxlayın, lazım olsa düzəldin, sonra Təsdiq edin."};
function rvOpen(m){$("rv").classList.add("on");$("rt").innerHTML="";$("rvs").textContent=m;$("rvok").disabled=true}
const rvClose=()=>$("rv").classList.remove("on");
function rvDraw(){const ex=new Set(N.map(x=>x.phone));
 $("rt").innerHTML="<tr><th><th>Nömrə<th>Operator<th>Kateqoriya<th>Qiymət ₼<th></tr>"+R.map((r,i)=>`<tr><td><input type="checkbox" ${r.on?"checked":""} onchange="R[${i}].on=this.checked;rvCount()"><td><input value="${r.ph}" maxlength="10" inputmode="numeric" style="width:130px" onchange="R[${i}].ph=this.value.replace(/\\D/g,'');rvDraw()">${ex.has(r.ph)?' <span class="tag">mövcuddur</span>':""}<td><select onchange="R[${i}].op=this.value">${optS(r.op,["",...OPL])}</select><td><select onchange="R[${i}].cat=this.value">${optS(r.cat,CATS)}</select><td><input type="tel" inputmode="tel" maxlength="6" value="${r.pr}" style="width:90px" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,6)" onchange="R[${i}].pr=this.value;R[${i}].cat=catByPrice(this.value);rvDraw()"><td><button class="red" onclick="R.splice(${i},1);rvDraw()">✕</button></tr>`).join("");
 rvCount();$("rvok").disabled=!R.length}
$("rvok").onclick=()=>{const sel=R.filter(r=>r.on);if(!sel.length)return alert("Heç nə seçilməyib");
 const bad=sel.find(r=>!/^0\d{9}$/.test(r.ph)||!OPL.includes(r.op)||r.pr===""||isNaN(+r.pr));
 if(bad)return alert("Səhv sətir: "+bad.ph+" (nömrə 10 rəqəm olmalı, operator və qiymət doldurulmalıdır)");
 const ex=new Set(N.map(x=>x.phone)),seen=new Set(),add=[],dup=[];
 sel.forEach(r=>{if(ex.has(r.ph)||seen.has(r.ph))dup.push(r.ph);else{seen.add(r.ph);add.push(r)}});
 if(dup.length)toast(dup.length+" təkrar nömrə əlavə olunmadı: "+dup.slice(0,3).map(fmt).join(", ")+(dup.length>3?" ...":""));
 if(add.length)run(db.from("numbers").insert(add.map(r=>({phone:r.ph,operator:r.op,category:r.cat,price:+r.pr}))));
 rvClose()};
$("bb").onclick=()=>$("bm").classList.add("on");
function bulkRead(){const rows=parse($("bulk").value);if(!rows.length)return alert("Nömrə tapılmadı. Hər sətirdə nömrə və qiymət yazın.");
 $("bm").classList.remove("on");R=rows;rvOpen("");rvDraw();$("bulk").value=""}
$("ex").onclick=()=>$("xm").classList.add("on");
function dl(name,mime,txt){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:typeof txt=="string"?mime+";charset=utf-8":mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$("xgo").onclick=async()=>{const t=$("xt").value,f=$("xf").value,rows=t=="numbers"?N:O;
 if(!rows.length)return alert("Cədvəl boşdur");
 const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))],nm=t+"_"+new Date().toISOString().slice(0,10);
 const cell=v=>v==null?"":(typeof v=="object"?JSON.stringify(v):String(v)).replace(/[\t\r\n]+/g," ");
 const csv=()=>{const q=v=>{let s=cell(v);if(/^0\d+$/.test(s))s='="'+s+'"';return '"'+s.replace(/"/g,'""')+'"'};dl(nm+".csv","text/csv","\ufeff"+[cols.map(q).join(";"),...rows.map(r=>cols.map(c=>q(r[c])).join(";"))].join("\r\n"))};
 if(f=="csv")csv();
 else if(f=="xlsx"){if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows,{header:cols}),t);XLSX.writeFile(wb,nm+".xlsx")}
  else{csv();alert("Excel kitabxanası yüklənmədi, CSV fayl yükləndi (Excel-də açılır).")}}
 else if(f=="db"){try{const SQL=await initSqlJs({locateFile:x=>"https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/"+x}),sq=new SQL.Database(),
  ty=c=>{const r=rows.find(r=>r[c]!=null),x=r&&r[c];return typeof x=="number"?(Number.isInteger(x)?"INTEGER":"REAL"):typeof x=="boolean"?"INTEGER":"TEXT"};
  sq.run('CREATE TABLE "'+t+'" ('+cols.map(c=>'"'+c+'" '+ty(c)+(c=="id"&&ty(c)=="INTEGER"?" PRIMARY KEY":"")).join(", ")+")");
  const st=sq.prepare('INSERT INTO "'+t+'" VALUES ('+cols.map(()=>"?").join(",")+")");
  rows.forEach(r=>st.run(cols.map(c=>{const x=r[c];return x==null?null:typeof x=="boolean"?+x:typeof x=="object"?JSON.stringify(x):x})));st.free();
  dl(nm+".db","application/x-sqlite3",sq.export());sq.close()}catch(err){return alert("DB faylı yaradılmadı: "+(err.message||err)+". İnternet bağlantısını yoxlayın.")}}
 $("xm").classList.remove("on")};
check();
</script></body></html>
