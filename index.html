const WA='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>',PH='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>';
const LOGO={Azercell:'https://thumb.wikimedia.org/wikipedia/az/thumb/b/bf/Azercell_loqosu.svg/960px-Azercell_loqosu.svg.png?utm_source=az.wikipedia.org&amp;utm_campaign=index&amp;utm_content=thumbnail',Bakcell:'https://upload.wikimedia.org/wikipedia/commons/0/06/Bakcell-logo.png?utm_source=az.wikipedia.org&amp;utm_campaign=index&amp;utm_content=original',Nar:'https://upload.wikimedia.org/wikipedia/commons/f/f7/Nar-new-logo.png?utm_source=az.wikipedia.org&amp;utm_campaign=index&amp;utm_content=original'};
const olg=o=>LOGO[o]?`<span class="olg"><img src="${LOGO[o]}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${o.toLowerCase()}.png'" alt="${esc(o)}"></span>`:'';
const $=id=>document.getElementById(id);let all=[];const IC={VIP:"👑",Qızıl:"🥇",Gümüş:"🥈",Bürünc:"🥉"};
let fv=new Set(),onlyFav=false,sel=new Set();const opm=$("opm"),lab=()=>{$("opb").textContent=sel.size?[...sel].map(t=>t.replace("op:","")).join(", "):"Fərdi Seçim"},uncheck=()=>opm.querySelectorAll("input").forEach(i=>i.checked=false);try{fv=new Set(JSON.parse(localStorage.getItem("fav")||"[]"))}catch(e){}
const fav=id=>{fv.has(id)?fv.delete(id):fv.add(id);try{localStorage.setItem("fav",JSON.stringify([...fv]))}catch(e){}render()};
const hl=(p,on)=>{const s=fmt(p);if(!on)return s;const D=(s.match(/\d/g)||[]).length,S=[4,5,8,9].map(i=>i+D-10);let n=-1;return[...s].map(c=>/\d/.test(c)?(n++,S.includes(n)?`<span class="hl">${c}</span>`:c):c).join("")};
const boxes=()=>[...document.querySelectorAll(".pat input")];
async function load(){const{data,error}=await db.from("numbers").select("*").neq("status","satılıb").order("price");
 if(error){$("list").innerHTML='<p class="empty">Nömrələr yüklənmədi. config.js yoxlayın.</p>';return}all=data;mark();render()}
function render(){const pf=$("pf").value,dg=boxes().map(i=>i.value),ct=$("cat").value,mn=+$("mn").value,mx=+$("mx").value,pr=$("pair").value,so=$("so").value;
 const r=all.filter(x=>(sel.size?[...sel].some(t=>t.startsWith("op:")?x.operator==t.slice(3):x.phone.startsWith(t)):(!pf||(pf.startsWith("op:")?x.operator==pf.slice(3):x.phone.startsWith(pf))))&&dg.every((v,i)=>!v||x.phone[3+i]==v)&&(!ct||x.category==ct)&&(!mn||x.price>=mn)&&(!mx||x.price<=mx)&&(!pr||(pr=="3"?x.phone.slice(4,6)==x.phone.slice(8,10):(pr=="1"?/^(\d\d)\1$/:/^(\d)(\d)\2\1$/).test(x.phone.slice(-4))))&&(!onlyFav||fv.has(x.id)));
 r.sort((a,b)=>(a.status=="rezerv")-(b.status=="rezerv")||(so=="desc"?b.price-a.price:a.price-b.price));$("cnt").textContent=r.length+" nömrə tapıldı";
 $("list").innerHTML=r.length?r.map(x=>`<div class="card"><button class="fav${fv.has(x.id)?" on":""}" onclick="fav(${x.id})" aria-label="Sevimlilərə əlavə et">${fv.has(x.id)?"♥":"♡"}</button>${isNew(x)?'<span class="new">Yeni</span>':''}<span class="tag ${esc(x.category)}">${IC[x.category]||""} ${esc(x.category)}</span> <span class="tag">${esc(x.operator)}</span><div class="nrow"><div class="num">${hl(x.phone,pr=="3")}</div>${olg(x.operator)}</div><div class="price">${esc(x.price)} ₼</div>${x.status=="rezerv"?'<span class="tag">Rezerv olunub</span>':`<div class="acts"><a class="cbtn ph" href="tel:+${WHATSAPP}">${PH}<span>Zəng Et</span></a><a class="cbtn wa" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Salam,mən "+x.phone+" nömrəsi ilə maraqlanıram")}" onclick="log(${x.id})">${WA}<span>Sifariş Et</span></a></div>`}</div>`).join(""):'<p class="empty">Bu axtarışla nömrə tapılmadı. Xanaları və ya filtrləri dəyişin.</p>';sv()}
const log=id=>{const x=all.find(n=>n.id==id);db.from("orders").insert({number_id:id,phone:x.phone,name:"WhatsApp",contact:"WhatsApp"}).then(()=>{})};
boxes().forEach((el,i,a)=>{
 el.oninput=()=>{el.value=el.value.replace(/\D/g,"").slice(-1);if(el.value&&a[i+1])a[i+1].focus()};
 el.onkeydown=e=>{if(e.key=="Enter")render();if(e.key=="Backspace"&&!el.value&&a[i-1])a[i-1].focus()};
 el.onfocus=()=>el.select()});
[$("mn"),$("mx")].forEach(el=>{el.oninput=()=>{el.value=el.value.replace(/\D/g,"").slice(0,6)};el.onkeydown=e=>{if(e.key=="Enter")render()}});
$("go").onclick=render;
$("opb").onclick=()=>opm.classList.add("on");
opm.onclick=e=>{if(e.target==opm)opm.classList.remove("on")};
document.addEventListener("keydown",e=>{if(e.key=="Escape")opm.classList.remove("on")});
$("opr").onclick=uncheck;$("opx").onclick=()=>opm.classList.remove("on");
$("opa").onclick=()=>{sel=new Set([...opm.querySelectorAll("input:checked")].map(i=>i.value));if(sel.size)$("pf").value="";lab();opm.classList.remove("on");render()};
$("pf").onchange=()=>{if($("pf").value){sel.clear();uncheck();lab()}};
$("so").onchange=render;$("fv").onclick=()=>{onlyFav=!onlyFav;$("fv").classList.toggle("on",onlyFav);$("fv").textContent=(onlyFav?"♥":"♡")+" Sevimlilər";render()};
$("clr").onclick=e=>{sel.clear();uncheck();lab();boxes().forEach(i=>i.value="");$("pf").value=$("cat").value=$("pair").value=$("mn").value=$("mx").value="";render()};
$("cw").href="https://wa.me/"+WHATSAPP;$("cp").href="tel:+"+WHATSAPP;
let newIds=new Set();
const isNew=x=>x.created_at?Date.now()-Date.parse(x.created_at)<6048e5:newIds.has(x.id);
function mark(){try{const raw=localStorage.getItem("seen"),old=new Set(JSON.parse(raw||"[]"));newIds=raw?new Set(all.filter(x=>!old.has(x.id)).map(x=>x.id)):new Set();localStorage.setItem("seen",JSON.stringify(all.map(x=>x.id)))}catch(e){}}
function sv(){try{localStorage.setItem("flt",JSON.stringify({pf:$("pf").value,sel:[...sel],ct:$("cat").value,pr:$("pair").value,so:$("so").value,mn:$("mn").value,mx:$("mx").value,dg:boxes().map(i=>i.value),fav:onlyFav}))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem("flt")||"null");if(s){sel=new Set(s.sel||[]);opm.querySelectorAll("input").forEach(i=>i.checked=sel.has(i.value));if(!sel.size)$("pf").value=s.pf||"";$("cat").value=s.ct||"";$("pair").value=s.pr||"";$("so").value=s.so||"asc";$("mn").value=s.mn||"";$("mx").value=s.mx||"";boxes().forEach((el,i)=>el.value=(s.dg||[])[i]||"");onlyFav=!!s.fav;$("fv").classList.toggle("on",onlyFav);$("fv").textContent=(onlyFav?"♥":"♡")+" Sevimlilər";lab()}}catch(e){}
if("serviceWorker" in navigator&&location.protocol!="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
load();
